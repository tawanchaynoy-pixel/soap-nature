
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soap Nature | Natural Soap</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f6ef;
      color: #40513b;
    }
    header {
      background: #dce5d3;
      padding: 25px;
      text-align: center;
    }
    h1 { margin: 0; }
    .hero {
      text-align: center;
      padding: 45px 15px;
    }
    .products {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      padding: 20px;
    }
    .product {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 250px;
      text-align: center;
    }
    .product img {
      width: 100%;
      border-radius: 10px;
    }
    button {
      background: #718b61;
      color: white;
      border: 0;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>SOAP NATURE</h1>
    <p>Natural Handmade Soap</p>
  </header>

  <section class="hero">
    <h2>ดูแลผิวอย่างอ่อนโยน ด้วยธรรมชาติ</h2>
    <p>สบู่ธรรมชาติที่คัดสรรเพื่อผิวของคุณ</p>
  </section>

  <section class="products">
    <div class="product">
      <img src="public/images/herbal-soap.jpg"
           alt="สบู่สมุนไพร">
      <h3>สบู่สมุนไพร</h3>
      <p>ราคา 59 บาท</p>
      <button onclick="alert('คุณเลือกสบู่สมุนไพร')">
        เลือกสินค้า
      </button>
    </div>

    <div class="product">
      <img src="public/images/milk-soap.jpg"
           alt="สบู่น้ำนม">
      <h3>สบู่น้ำนม</h3>
      <p>ราคา 69 บาท</p>
      <button onclick="alert('คุณเลือกสบู่น้ำนม')">
        เลือกสินค้า
      </button>
    </div>
  </section>
</body>
</html>
